# 阶段 4 实验配置（唯一权威源）。
# 改布局 / 检测位 / 面定义 / 速度 / 阈值：只改本文件，不要改 Python。
#
# -----------------------------------------------------------------------------
# 零件坐标系 object_frame（与 Gazebo small_part 盒子轴一致）
# -----------------------------------------------------------------------------
# 初始姿态 orientation_rpy 全 0、零件平放在桌面上时：
#
#         +Z 顶面 20×40 mm   ← Face1
#          ^
#          |
#          |     +Y 40 mm 端面   ← Face2
#          |    /
#          |   /
#          +----------> +X 夹持宽度 20 mm（左右夹指接触的一对侧面）
#
#   -X：另一侧夹持面（被夹爪挡住，阶段 4 不检测）
#   -Y：另一端面 20×20 mm   ← Face3
#   -Z：底面（桌面接触面，阶段 4 不检测）
#
# 夹爪俯抓时沿 ±X 闭合，因此 Face1/2/3 选 +Z / +Y / -Y，避免检测被夹指挡住的面。
#
# FaceN 朝向 D1 的含义：该面在 object_frame 中的法向，旋转后与
# inspection.direction 对齐。up_in_object 用来消掉绕法向的自由旋转。

frames:
  world: world
  robot_base: base_link
  object: object_frame
  tcp: gripper_tcp

move_group: fairino3_v6_group
ee_link: gripper_tcp
base_frame: base_link
planning_frame: base_link
attach_link: gripper_tcp

robot:
  # T_world_base：机器人基座安装位姿（robot base / mounting pose）。
  #
  # 仿真 Gazebo 的 world_to_base 固定关节、真机 static TF、
  # MoveIt Planning Scene 回退变换，全部只读这一块。
  #
  # 改侧装角度、安装高度、底座在工作站中的位置：只改这里。
  # 不要再改 real_installation.yaml。
  #
  # z=0.60 当前为临时实验值：world 地面 -> base_link 原点。
  #
  # orientation_xyzw 是真机已验证的侧装四元数：
  #   R_world_base = Ry(90 deg) * Rz(-135 deg)
  # 仿真启动时会把它转成 URDF RPY，不要在别处再写一份姿态。
  base_pose:
    frame: world
    position:
      x: 0.10
      y: 0.0
      z: 1.20

    orientation_xyzw:
      x: -0.6532814824381882
      y: 0.2705980500730985
      z: -0.6532814824381883
      w: 0.2705980500730986

  initial_joint_positions:
    j1: 139.629 #2.4468
    j2: -91.446 #-1.6214
    j3: 95.946 #1.5465
    j4: -95.318 #-1.5877
    j5: -79.32 #-1.6368
    j6: 136.408 #0.0

column:
  name: mounting_column

  # FR3 为 90° 侧装：j1 轴（base_link +Z）沿 world +X。
  # 立柱必须在安装面后方（world -X），不能和 base_link 原点重合。
  # 若柱心仍在 (0, 0)，1 m 高的盒子会穿过 shoulder / j1，RViz 第一轴变红。
  #
  # SDF box 的 pose 在几何中心。
  # x = -thickness/2 使柱子贴在 x=0 的安装面上，占据 x∈[-0.16, 0]。
  initial_pose:
    frame: world
    position:
      x: 0
      y: 0.0
      z: 0.7
    orientation_rpy:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

  dimensions:
    x: 0.2
    y: 0.2
    # TEMP：柱子实际高度尚未测量
    z: 1.4

  # 立柱与底座是紧固件连接，PlanningScene 允许接触。
  # 不要把 shoulder_link / j1 加进来，否则第一轴撞柱子不会变红。
  touch_links:
    - base_link

table:
  name: table
  initial_pose:
    frame: world
    position:
      x: 0.0
      y: 0.8
      z: 0.735
    orientation_rpy:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  dimensions:
    x: 1
    y: 1
    z: 0.03

object:
  name: small_part
  mass: 0.03
  initial_pose:
    frame: world
    position:
      x: 0.0
      y: 0.45
      z: 0.7675
    orientation_rpy:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  # 圆柱形零件
  # 直径 = 15 mm
  # 高度 = 35 mm
  shape: cylinder
  dimensions:
    radius: 0.0075
    height: 0.035

grasp:
  # TCP +z 接近方向；TCP +x 由 approach_up_direction 确定（消掉绕接近轴旋转）。
  # 当前与阶段 3 approach_rpy=(pi, 0, 0) 等价：俯抓，夹持零件 20 mm 宽度。
  pregrasp_distance: 0.08
  lift_distance: 0.08
  approach_direction:
    x: 0.0
    y: 0.0
    z: -1.0
  approach_up_direction:
    x: 1.0
    y: 0.0
    z: 0.0
  table_top_z: 0.750
  fingertip_from_tcp: 0.036
  table_clearance: 0.015
  cartesian_eef_step: 0.01
  cartesian_fraction_min: 0.95
  close_settle_seconds: 1.5
  gripper_timeout_sec: 40.0
  # 阶段 3 纯摩擦可以抬起；阶段 4 要把顶面转到 D1，零件会沿夹指缝滑落。
  # 这里启用已有的 Gazebo DetachableJoint，不靠改 TCP 假装零件还在 P1。
  use_sim_attach: true

gripper_touch_links:
  - gripper_base_link
  - rail_155
  - slider_l
  - slider_r
  - finger_l
  - finger_r
  - gripper_gap_link
  - wrist3_link
  - wrist2_link
  - wrist1_link
  - forearm_link

inspection:
  # P1 = 零件中心目标位置，不是 TCP 目标。
  position:
    frame: base_link
    x: 0.40
    y: 0.05
    z: 0.28
  # D1 = 被检面法向应对齐的方向（在 inspection.position.frame 下，程序会归一化）。
  direction:
    frame: base_link
    x: 0.0
    y: 1.0
    z: 0.0
  up_direction:
    frame: base_link
    x: 0.0
    y: 0.0
    z: 1.0
  faces:
    face1:
      description: "顶面 +Z"
      normal_in_object: [0.0, 0.0, 1.0]
      up_in_object: [0.0, -1.0, 0.0]
    face2:
      description: "+Y 端面"
      normal_in_object: [0.0, 1.0, 0.0]
      up_in_object: [0.0, 0.0, 1.0]
    face3:
      description: "-Y 端面"
      normal_in_object: [0.0, -1.0, 0.0]
      up_in_object: [0.0, 0.0, 1.0]
  hold_seconds: 2.0
  face_waypoint_count: 12

motion:
  velocity_scaling: 0.2
  acceleration_scaling: 0.2
  planning_time: 10.0
  planning_attempts: 16
  position_tolerance: 0.005
  orientation_tolerance_deg: 3.0
  tcp_tolerance: 0.020
  pose_attempts: 3

validation:
  max_position_error_m: 0.002
  max_face_angle_error_deg: 3.0
  max_up_angle_error_deg: 5.0
  max_slip_position_m: 0.005
  max_slip_angle_deg: 8.0
