# 阶段 4 实验配置（唯一权威源）。
# 改布局 / 检测位 / 面定义 / 速度 / 阈值：只改本文件，不要改 Python。
#
# -----------------------------------------------------------------------------
# 零件坐标系 object_frame（与 Gazebo small_part 盒子轴一致）
# -----------------------------------------------------------------------------
# 初始姿态 orientation_rpy 全 0、零件平放在桌面上时：
#
#         +Z 顶面 20×40 mm   ← Face1
#          ^
#          |
#          |     +Y 40 mm 端面   ← Face2
#          |    /
#          |   /
#          +----------> +X 夹持宽度 20 mm（左右夹指接触的一对侧面）
#
#   -X：另一侧夹持面（被夹爪挡住，阶段 4 不检测）
#   -Y：另一端面 20×20 mm   ← Face3
#   -Z：底面（桌面接触面，阶段 4 不检测）
#
# 夹爪俯抓时沿 ±X 闭合，因此 Face1/2/3 选 +Z / +Y / -Y，避免检测被夹指挡住的面。
#
# FaceN 朝向 D1 的含义：该面在 object_frame 中的法向，旋转后与
# inspection.direction 对齐。up_in_object 用来消掉绕法向的自由旋转。

frames:
  world: world
  robot_base: base_link
  object: object_frame
  tcp: gripper_tcp

move_group: fairino3_v6_group
ee_link: gripper_tcp
base_frame: base_link
planning_frame: base_link
attach_link: gripper_tcp

robot:
  # Gazebo spawn 位姿（world）。由 stage4_sim.launch.py 传给 ros_gz_sim create。
  # MoveIt 规划在 base_link 下进行；非零底座时，程序用该变换把 world 零件位姿
  # 转到 base_link，不依赖猜测的 world≡base_link。
  base_pose:
    frame: world
    position:
      x: 0.0
      y: 0.0
      z: 0.0
    orientation_rpy:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

  # 与 SRDF group_state pos1 / 阶段 3 grasp.yaml home 一致。
  initial_joint_positions:
    j1: 2.4468
    j2: -1.6214
    j3: 1.5465
    j4: -1.5877
    j5: -1.6368
    j6: 0.0

table:
  name: table
  initial_pose:
    frame: world
    position:
      x: 0.5
      y: 0.0
      z: 0.05
    orientation_rpy:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  dimensions:
    x: 0.5
    y: 0.5
    z: 0.05

object:
  name: small_part
  mass: 0.03
  initial_pose:
    frame: world
    position:
      x: 0.5
      y: 0.0
      z: 0.086
    orientation_rpy:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  # x=夹持宽度, y=长度, z=高度。stage4_sim.launch.py 用这些数字生成 SDF。
  dimensions:
    x: 0.020
    y: 0.040
    z: 0.020

grasp:
  # TCP +z 接近方向；TCP +x 由 approach_up_direction 确定（消掉绕接近轴旋转）。
  # 当前与阶段 3 approach_rpy=(pi, 0, 0) 等价：俯抓，夹持零件 20 mm 宽度。
  pregrasp_distance: 0.08
  lift_distance: 0.08
  approach_direction:
    x: 0.0
    y: 0.0
    z: -1.0
  approach_up_direction:
    x: 1.0
    y: 0.0
    z: 0.0
  table_top_z: 0.075
  fingertip_from_tcp: 0.036
  table_clearance: 0.015
  cartesian_eef_step: 0.01
  cartesian_fraction_min: 0.95
  close_settle_seconds: 1.5
  gripper_timeout_sec: 40.0
  # 阶段 3 纯摩擦可以抬起；阶段 4 要把顶面转到 D1，零件会沿夹指缝滑落。
  # 这里启用已有的 Gazebo DetachableJoint，不靠改 TCP 假装零件还在 P1。
  use_sim_attach: true

gripper_touch_links:
  - gripper_base_link
  - rail_155
  - slider_l
  - slider_r
  - finger_l
  - finger_r
  - gripper_gap_link
  - wrist3_link
  - wrist2_link
  - wrist1_link
  - forearm_link

inspection:
  # P1 = 零件中心目标位置，不是 TCP 目标。
  position:
    frame: base_link
    x: 0.40
    y: 0.05
    z: 0.28
  # D1 = 被检面法向应对齐的方向（在 inspection.position.frame 下，程序会归一化）。
  direction:
    frame: base_link
    x: 0.0
    y: 1.0
    z: 0.0
  up_direction:
    frame: base_link
    x: 0.0
    y: 0.0
    z: 1.0
  faces:
    face1:
      description: "顶面 +Z"
      normal_in_object: [0.0, 0.0, 1.0]
      up_in_object: [0.0, -1.0, 0.0]
    face2:
      description: "+Y 端面"
      normal_in_object: [0.0, 1.0, 0.0]
      up_in_object: [0.0, 0.0, 1.0]
    face3:
      description: "-Y 端面"
      normal_in_object: [0.0, -1.0, 0.0]
      up_in_object: [0.0, 0.0, 1.0]
  hold_seconds: 2.0
  face_waypoint_count: 12

motion:
  velocity_scaling: 0.2
  acceleration_scaling: 0.2
  planning_time: 10.0
  planning_attempts: 16
  position_tolerance: 0.005
  orientation_tolerance_deg: 3.0
  tcp_tolerance: 0.020
  pose_attempts: 3

validation:
  max_position_error_m: 0.002
  max_face_angle_error_deg: 3.0
  max_up_angle_error_deg: 5.0
  max_slip_position_m: 0.005
  max_slip_angle_deg: 8.0
