# dual_bringup.launch.py reads this file.
# dual_mock_bringup.launch.py still refuses anything except mock.
#
# Keep both backends at mock until you intentionally connect a real arm.
# Setting backend: real will open that arm's controller_ip.
# Do not set arm_b.backend: real until the second robot exists.

arm_a:
  backend: real
  controller_ip: "192.168.58.2"
  gripper_service: /arm_a/fairino_gripper/command
  gripper_node: arm_a_fairino_gripper_bridge

arm_b:
  backend: real
  controller_ip: "192.168.58.5"
  gripper_service: /arm_b/fairino_gripper/command
  gripper_node: arm_b_fairino_gripper_bridge
  # NOMINAL only. Recalibrate T_world_base_B when Arm B arrives.
  # Position stays on the opposite column face.
  # R_world_base_B = Rx(pi) * Rz(pi) * R_world_base_A
  # (column-opposite, then roll 180 deg about world X; translation unchanged)
  base_pose:
    frame: world
    position:
      x: -0.10
      y: 0.0
      z: 1.10
    orientation_xyzw:
      x: 0.6532814824381883
      y: -0.2705980500730986
      z: -0.6532814824381882
      w: 0.2705980500730985
